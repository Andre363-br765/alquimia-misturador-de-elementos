<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/css/style.css" />
    <link rel="stylesheet" href="./src/css/responsive.css">
    <script src="./src/js/script.js" defer></script>
    <title>Misturador de Coisas Aleatórias</title>
  </head>

  <body>
    <header>
      <h1>Misturador de Coisas Aleatórias</h1>
      <p>Escolha dois elementos para ver o resultado da fusão alquímica.</p>
    </header>

    <main>
      <section class="inputs">
        <div class="input-box">
          <label for="elemento1">Elemento 1</label>
          <select id="elemento1">
            <!-- Será preenchido via JavaScript -->
          </select>
        </div>

        <div class="input-box">
          <label for="elemento2">Elemento 2</label>
          <select id="elemento2">
            <!-- Será preenchido via JavaScript -->
          </select>
        </div>

        <button id="btn-misturar">Misturar</button>
      </section>

      <!-- Área de resultado -->
      <section id="resultado" class="resultado">
        <!-- Conteúdo dinâmico preenchido pelo JS -->
      </section>
    </main>

    <footer>
      <p>Feito por André — Imersão Dev</p>
      <p>
        <a href="https://github.com/Andre363-br765" target="_blank">GitHub</a> •
        <a href="https://www.alura.com.br/" target="_blank">Alura</a>
      </p>
    </footer>
  </body>
</html>
